<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#F7F8FA;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  #bar { position:fixed; top:0; left:0; right:0; height:56px; background:#FFFFFF;

  #bar .hint { font-size:12px; color:#8A94A6; }
  #bar .btns { margin-left:auto; display:flex; gap:8px; }
  #bar button { border:1px solid #D5DAE1; background:#fff; color:#3C4A5C; font-size:12px;
    padding:5px 12px; border-radius:6px; cursor:pointer; font-family:inherit; }
  #bar button:hover { background:#F1F4F8; }
  #stage { position:absolute; top:56px; left:0; right:0; bottom:0; overflow:auto; cursor:grab; }
  #stage.drag { cursor:grabbing; }
  #canvas { position:relative; transform-origin:0 0; }
  svg#links { position:absolute; left:0; top:0; pointer-events:none; }
  .node { position:absolute; border-radius:9px; padding:7px 12px; cursor:pointer;

  .node .sub { display:block; font-size:10.5px; opacity:.75; margin-top:3px; line-height:1.35; }

  .d1 { font-size:14px; font-weight:600; color:#1B2733; }
  .d2 { font-size:12.5px; color:#26313D; }
  .d3 { font-size:11.5px; color:#4A5666; }
  .node:hover { box-shadow:0 3px 12px rgba(0,0,0,.12); }
  #foot { position:fixed; right:16px; bottom:12px; font-size:11px; color:#9AA4B2;

        { t:'四类句式模板', c:[
            { t:'文件类', s:'查见《X》，规定了……' },

            { t:'现场 / 访谈类', s:'现场询问负责人，表示……' },

        { t:'措辞固化', s:'五种结论句型，禁止模型自创第六种' }
    ]},
    { t:'⑧ 落地与边界', c:[
        { t:'新增三张表', c:[
            { t:'clause_syntax 条款语法', s:'决定"问什么"' },
            { t:'evidence_recipe 证据配方', s:'决定"看什么"' },
            { t:'finding_template 句式模板', s:'决定"怎么写"' }
        ]},
        { t:'三期实施', s:'一期覆盖度缺口 → 二期五态判定 → 三期报告闭环' },
        { t:'四道闸门', s:'证据可溯 · 判定留白 · 人工签署 · 模式复核' },
        { t:'自动化上限约七成', s:'设计开发有效性、风险准则、灭菌确认、现场一致性、人员能力、法规适用、管评深度必须到现场' }
    ]}

const canvas = document.getElementById('canvas');
const svg = document.getElementById('links');
const stage = document.getElementById('stage');
let allNodes = [], rootNode = null, scale = 1;

function tint(hex, k){
  const r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  const m=(c)=>Math.round(255 - (255-c)*k);
  return 'rgb('+m(r)+','+m(g)+','+m(b)+')';
}

function mkNode(d, depth, parent, branchIdx){
  const el = document.createElement('div');
  el.className = 'node ' + (depth===0?'root':'d'+depth);
  const t = document.createElement('span');
  t.className='t'; t.textContent = d.t;
  el.appendChild(t);
  if(d.s){ const s=document.createElement('span'); s.className='sub'; s.textContent=d.s; el.appendChild(s); }
  if(depth===1){
    el.style.background = '#ffffff';
    el.style.borderLeft = '6px solid ' + COLORS[branchIdx];
    el.style.color = COLORS[branchIdx];
    el.style.boxShadow = '0 1px 3px rgba(0,0,0,.07)';
  } else if(depth===2){
    el.style.background = tint(COLORS[branchIdx], 0.045);
    el.style.borderLeft = '3px solid ' + COLORS[branchIdx];
  } else if(depth===3){
    el.style.background = '#ffffff';
    el.style.borderLeft = '2px solid ' + COLORS[branchIdx];
    el.style.boxShadow = '0 1px 2px rgba(0,0,0,.05)';
  }
  el.style.maxWidth = MAXW[depth] + 'px';
  el.style.left = COLX[depth] + 'px';
  el.style.top = '0px';
  canvas.appendChild(el);
  const node = { el, depth, parent, children:[], collapsed:false, h:0, color:COLORS[branchIdx] };
  if(parent) parent.children.push(node);
  (d.c||[]).forEach((ch,i)=>mkNode(ch, depth+1, node, depth===0 ? i : branchIdx));
  el.addEventListener('click', e=>{
    e.stopPropagation();
    if(!node.children.length) return;
    node.collapsed = !node.collapsed;
    layout();
  });
  allNodes.push(node);
  return node;
}

function visChildren(n){ return n.collapsed ? [] : n.children; }

function measure(n){
  n.h = n.el.offsetHeight;
  const kids = visChildren(n);
  if(!kids.length){ n.blockH = 0; return; }
  kids.forEach(measure);
  n.blockH = kids.reduce((a,c)=>a+c.h,0) + GAP*(kids.length-1);
  n.h = Math.max(n.h, n.blockH);
}

function place(n, top){
  const kids = visChildren(n);
  if(!kids.length){
    n.el.style.top = (top + (n.h - n.el.offsetHeight)/2) + 'px';
    return;
  }
  let childTop = top + (n.h - n.blockH)/2;
  kids.forEach(c=>{ place(c, childTop); childTop += c.h + GAP; });
  n.el.style.top = (top + (n.h - n.el.offsetHeight)/2) + 'px';
}

function drawLinks(){
  const NS='http://www.w3.org/2000/svg';
  svg.innerHTML='';
  let W=0,H=0;
  allNodes.forEach(n=>{
    if(n.el.style.display==='none') return;
    const x=parseFloat(n.el.style.left), y=parseFloat(n.el.style.top);
    W=Math.max(W, x+n.el.offsetWidth+40);
    H=Math.max(H, y+n.el.offsetHeight+40);
    visChildren(n).forEach(c=>{
      const x1=x+n.el.offsetWidth, y1=y+n.el.offsetHeight/2;
      const x2=parseFloat(c.el.style.left), y2=parseFloat(c.el.style.top)+c.el.offsetHeight/2;
      const dx=(x2-x1)*0.55;
      const path=document.createElementNS(NS,'path');
      path.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
      path.setAttribute('stroke', c.color);
      path.setAttribute('stroke-width', n.depth===0 ? 2.6 : 1.6);
      path.setAttribute('fill','none');
      path.setAttribute('opacity', n.depth===0 ? 0.9 : 0.65);
      path.setAttribute('stroke-linecap','round');
      svg.appendChild(path);
    });
  });
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
}

function layout(){
  allNodes.forEach(n=>{
    let hidden=false, p=n.parent;
    while(p){ if(p.collapsed){ hidden=true; break; } p=p.parent; }
    n.el.style.display = hidden ? 'none' : 'block';
  });
  measure(rootNode);
  place(rootNode, 26);
  drawLinks();
}

rootNode = mkNode(DATA, 0, null, 0);
layout();

function applyScale(s){
  scale = Math.min(1.6, Math.max(0.4, s));
  canvas.style.transform = 'scale('+scale+')';
}
document.getElementById('zin').onclick = ()=>applyScale(scale*1.15);
document.getElementById('zout').onclick = ()=>applyScale(scale/1.15);
document.getElementById('expand').onclick = ()=>{
  allNodes.forEach(n=>n.collapsed=false);
  layout(); applyScale(1.05); stage.scrollTo(0,0);
};
document.getElementById('reset').onclick = ()=>{ applyScale(1); stage.scrollTo(0,0); };

let down=false, sx=0, sy=0, sl=0, st=0;
stage.addEventListener('mousedown', e=>{
  if(e.target.closest('.node')) return;
  down=true; stage.classList.add('drag');
  sx=e.clientX; sy=e.clientY; sl=stage.scrollLeft; st=stage.scrollTop;
});
window.addEventListener('mousemove', e=>{
  if(!down) return;
  stage.scrollLeft = sl - (e.clientX-sx);
  stage.scrollTop  = st - (e.clientY-sy);
});
window.addEventListener('mouseup', ()=>{ down=false; stage.classList.remove('drag'); });
</script>
