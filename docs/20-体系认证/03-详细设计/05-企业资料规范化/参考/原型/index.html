<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 42 · v2 · 专家端 · 企业资料规范化</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ============ 顶栏 ============ -->
  <div class="topbar">
    <span class="topbar__title">映智汇 · 专家端</span>
    <div class="menu" id="menu"></div>
    <span class="topbar__spacer"></span>
    <span class="tag tag--gray">原型 v5</span>
    <button class="btn btn--sm" onclick="demoUpload()" title="模拟企业重新上传一份资料，看依赖失效如何传播">⚡ 模拟资料更新</button>
    <button class="btn btn--sm" onclick="location.reload()">重置</button>
  </div>

  <div class="body">

    <!-- ============ 左树：企业 → 阶段 → 标准 → 文件夹 → 文件 ============ -->
    <div class="sidebar">
      <div class="card__head" style="border-bottom:1px solid var(--yzh-color-border-light)">
        <span>企业资源</span><span class="spacer"></span>
        <button class="btn btn--link btn--sm" onclick="expandAll(true)">展开</button>
        <button class="btn btn--link btn--sm" onclick="expandAll(false)">折叠</button>
      </div>
      <div class="tree" id="tree"></div>
    </div>

    <!-- ============ 右区：顶部只有面包屑，底部集中「操作 + 问题」 ============ -->
    <div class="main" id="mainBox">
      <div id="queueInline"></div>

      <!-- ① 面包屑 -->
      <div class="crumb" id="crumb"></div>

      <!-- ② ★ 功能菜单（面包屑正下方） -->
      <div class="funcbar" id="funcBar"></div>

      <!-- ② 内容区（文件夹页面 / 文件页面） -->
      <div class="card" id="folderCard">
        <table class="tbl">
          <thead><tr>
            <th style="width:30px"><input type="checkbox" id="chkAll" onchange="toggleAll(this.checked)"></th>
            <th style="width:22px"></th>
            <th style="width:30px">类型</th>
            <th>名称</th>
            <th style="width:78px">状态</th>
            <th style="width:112px">完成度</th>
            <th style="width:60px">可信度</th>
            <th style="width:auto;min-width:180px">备注（可能存在的问题）</th>
            <th style="width:132px">操作</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <!-- ③ 文件页面（整页替换） -->
      <div id="filePage" style="display:none"></div>

      <!-- ④ ★ 底部：本页存在的问题（操作已在顶部功能菜单） -->
      <div id="bottomBar"></div>

      <!-- ⑤ 页脚说明 -->
      <div class="footnote" id="footnote"></div>
    </div><!-- /main -->
  </div><!-- /body -->
</div><!-- /app -->

<!-- ★ v4：文件页面已改为整页（#filePage），此处仅保留「依赖明细」抽屉 -->
<div id="maskDep" class="mask" style="display:none" onclick="closeDrawer('dep')"></div>
<div id="drawerDep" class="drawer" style="display:none;width:70%;max-width:900px">
  <div class="drawer__head">
    <span class="drawer__title">依赖明细</span>
    <span class="grow"></span>
    <button class="btn btn--sm" onclick="closeDrawer('dep')">✕ 关闭</button>
  </div>
  <div class="drawer__body" id="depBody"></div>
  <div class="drawer__foot"><span class="grow"></span><button class="btn btn--primary" onclick="closeDrawer('dep')">知道了</button></div>
</div>

<!-- ============ 抽屉：队列明细 ============ -->
<div id="maskQ" class="mask" style="display:none" onclick="closeDrawer('q')"></div>
<div id="drawerQ" class="drawer" style="display:none;width:62%;max-width:820px">
  <div class="drawer__head">
    <span class="drawer__title">队列明细</span>
    <span class="mono" id="qCode"></span>
    <span class="grow"></span>
    <button class="btn btn--sm" onclick="closeDrawer('q')">✕ 关闭</button>
  </div>
  <div class="drawer__body" id="qBody"></div>
  <div class="drawer__foot">
    <span class="small muted">一个文件 = 一个任务（原子）· 失败只重试自己</span>
    <span class="grow"></span>
    <button class="btn btn--warn" onclick="retryFailed()">↻ 重试失败项</button>
    <button class="btn" onclick="closeDrawer('q')">关闭</button>
  </div>
</div>

<!-- ============ 抽屉：说明 ============ -->
<div id="maskH" class="mask" style="display:none" onclick="closeDrawer('h')"></div>
<div id="drawerH" class="drawer" style="display:none;width:56%;max-width:760px">
  <div class="drawer__head">
    <span class="drawer__title">使用说明</span><span class="grow"></span>
    <button class="btn btn--sm" onclick="closeDrawer('h')">✕ 关闭</button>
  </div>
  <div class="drawer__body" id="hBody"></div>
  <div class="drawer__foot"><span class="grow"></span><button class="btn btn--primary" onclick="closeDrawer('h')">知道了</button></div>
</div>

<!-- ============ 抽屉：独立菜单（日志 / 资料管理）预览 ============ -->
<div id="maskM" class="mask" style="display:none" onclick="closeDrawer('m')"></div>
<div id="drawerM" class="drawer" style="display:none;width:56%;max-width:760px">
  <div class="drawer__head">
    <span class="drawer__title" id="mTitle"></span><span class="grow"></span>
    <button class="btn btn--sm" onclick="closeDrawer('m')">✕ 关闭</button>
  </div>
  <div class="drawer__body" id="mBody"></div>
  <div class="drawer__foot"><span class="grow"></span><button class="btn btn--primary" onclick="closeDrawer('m')">知道了</button></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
