# ============================================================
# cert-admin（管理端）站配置 — 容器内 nginx，监听 80
# 同源托管 dist 静态资源 + 反代 /api（含 SignalR WS）+ /swagger 到宿主后端
# ============================================================

# WebSocket 升级映射（SignalR /api/yzh-msg 需要；conf.d 位于 http 上下文，map 合法）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 文件上传（证据/附件）体积上限，与后端保持一致
    client_max_body_size 512m;

    # ---- gzip：减少跨境隧道上的传输字节 ----
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/xml
                      application/javascript application/json application/xml
                      application/xml+rss image/svg+xml font/woff2;

    # ---- 带 hash 的静态资源：长缓存 + immutable ----
    location /assets/ {
        access_log off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 入口页：禁止缓存，保证发版即生效 ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- 后端 API（同源反代到宿主 127.0.0.1:9992）----
    location /api/ {
        proxy_pass         http://host.docker.internal:9992;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket / SignalR
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Swagger UI/JSON（接口管理页「测试」深链）----
    location /swagger/ {
        proxy_pass         http://host.docker.internal:9992;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- SPA history 路由回退（否则刷新子路由 404）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
